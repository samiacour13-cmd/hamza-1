<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رحلة في عالم الهمزة</title>
<style>
:root{--navy:#1d3557;--teal:#2a6f77;--gold:#b88a2e;--bg:#f5f3ee;--card:#fff;--ink:#222a33;--mut:#66707c;--ok:#1e7a4c;--okbg:#e6f4ec;--bad:#b3362f;--badbg:#fbeceb;--line:#e2ddd0;--sel:#e8eef7}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Naskh Arabic","Amiri","Traditional Arabic","Segoe UI",Tahoma,"Geeza Pro",Arial,sans-serif;font-size:18px;line-height:1.9}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px rgba(29,53,87,.06);padding:22px}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{text-align:center;padding:34px 24px}
.kicker{color:var(--gold);font-weight:700;letter-spacing:.3px}
.hero h1{margin:.2em 0 0;color:var(--navy);font-size:2.1em;line-height:1.4}
.hero h2{margin:.1em 0 .6em;color:var(--teal);font-weight:600;font-size:1.25em}
.hero p{max-width:760px;margin:.4em auto}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;text-align:right;margin:22px 0}
.box{background:#faf8f3;border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.box h3{margin:.1em 0 .3em;color:var(--navy);font-size:1.05em}
.box ul{margin:0;padding:0 20px 0 0;font-size:.92em}
.btn{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:10px 26px;font-weight:700;transition:.2s}
.btn:hover{background:#274a78}
.btn:disabled{background:#b7bfca;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.sec:hover{background:var(--sel)}
.btn.gold{background:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.dash{position:sticky;top:12px}
.dash h3{margin:0 0 8px;color:var(--navy);font-size:1.05em}
.bar{height:12px;background:#e9e5da;border-radius:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--navy));width:0;transition:width .5s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.st{background:#faf8f3;border:1px solid var(--line);border-radius:10px;padding:6px 10px;text-align:center;font-size:.85em;line-height:1.5}
.st b{display:block;font-size:1.4em;color:var(--navy)}
.st.g b{color:var(--ok)}.st.r b{color:var(--bad)}
.axrow{font-size:.82em;line-height:1.5;margin:8px 0}
.axrow .bar{height:7px;margin-top:3px}
.axrow .bar>i{background:var(--gold)}
.axrow span.lv{color:var(--mut)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:.78em;padding:1px 12px;border-radius:20px;background:var(--sel);color:var(--navy);border:1px solid #cfd9ea}
.tag.lv-b{background:#e6f4ec;color:var(--ok);border-color:#c5e3d2}
.tag.lv-m{background:#fff4dd;color:#8a6414;border-color:#f0dcaa}
.tag.lv-a{background:#f7e4e2;color:var(--bad);border-color:#ecc4c0}
.instr{color:var(--mut);font-size:.88em;margin-bottom:4px}
.qtext{font-size:1.18em;font-weight:600;margin:6px 0 14px;line-height:2}
.tg{background:#fdf1cf;border-bottom:3px solid var(--gold);padding:0 6px;border-radius:5px;font-weight:700;color:#4b3600;white-space:nowrap}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:right;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:8px 14px;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--teal);background:#f3f8f8}
.opt.sel{border-color:var(--navy);background:var(--sel)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.bul{flex:0 0 32px;height:32px;border-radius:50%;background:var(--sel);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9em}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tfrow .opt{justify-content:center;font-weight:700;font-size:1.1em}
.sub{margin:12px 0 6px;font-weight:700;color:var(--navy);font-size:.95em}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.key{min-width:44px;height:44px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:9px;font-weight:700;font-size:1.15em}
.key:hover{background:var(--sel)}
.blank{display:inline-block;min-width:34px;text-align:center;border-bottom:3px dashed var(--navy);background:#e8eef7;border-radius:6px;margin:0 2px;cursor:pointer;color:var(--navy)}
.blank.act{background:#ffe9a8;border-bottom-color:var(--gold)}
.blank.ok{background:var(--okbg);color:var(--ok);border-bottom:3px solid var(--ok)}
.blank.bad{background:var(--badbg);color:var(--bad);border-bottom:3px solid var(--bad)}
input.txt,textarea.txt,select.sl{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff}
input.txt:focus,textarea.txt:focus,select.sl:focus{outline:2px solid var(--teal);border-color:var(--teal)}
textarea.txt{min-height:110px;resize:vertical}
.ok-b{border-color:var(--ok)!important;background:var(--okbg)!important}
.bad-b{border-color:var(--bad)!important;background:var(--badbg)!important}
.clsrow{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:12px;align-items:center;margin:8px 0}
.clsrow .w{font-size:1.15em;font-weight:700}
.fixnote{font-size:.85em;color:var(--bad)}
.actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
.fb{margin-top:16px;border-radius:12px;padding:12px 16px;border:1.5px solid}
.fb.ok{background:var(--okbg);border-color:#bfe0cd}
.fb.bad{background:var(--badbg);border-color:#efc7c4}
.fb h4{margin:0 0 4px;font-size:1.05em}
.fb.ok h4{color:var(--ok)}.fb.bad h4{color:var(--bad)}
.fb p{margin:.3em 0}
.rule{background:#fff;border-radius:9px;padding:6px 12px;border-right:4px solid var(--gold);margin-top:8px;font-size:.95em}
.crit{margin:6px 0;padding:0;list-style:none;font-size:.95em}
.crit li::before{content:"✓ ";color:var(--ok);font-weight:700}
.crit li.no::before{content:"✗ ";color:var(--bad)}
.axintro{text-align:center;padding:40px 24px}
.axintro .num{display:inline-block;width:64px;height:64px;line-height:64px;border-radius:50%;background:var(--navy);color:#fff;font-size:1.8em;font-weight:700}
.axintro h2{color:var(--navy);margin:.4em 0 .1em}
.big{font-size:3em;font-weight:800;color:var(--navy);line-height:1.2}
.big small{font-size:.4em;color:var(--mut);font-weight:600}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:14px 0}
table.rt{width:100%;border-collapse:collapse;margin:8px 0;font-size:.95em}
table.rt th,table.rt td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right}
table.rt th{background:#faf8f3;color:var(--navy)}
.pill{display:inline-block;padding:0 12px;border-radius:20px;font-size:.85em;background:var(--sel);color:var(--navy)}
.pill.g{background:var(--okbg);color:var(--ok)}.pill.y{background:#fff4dd;color:#8a6414}.pill.r{background:var(--badbg);color:var(--bad)}
h3.sec{color:var(--navy);border-right:5px solid var(--gold);padding-right:10px;margin:26px 0 8px}
details.err{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#fff}
details.err summary{cursor:pointer;padding:8px 14px;font-weight:600;list-style:none}
details.err summary::-webkit-details-marker{display:none}
details.err[open] summary{border-bottom:1px solid var(--line);background:#faf8f3}
details.err .in{padding:6px 16px 12px}
.tiny{font-size:.82em;color:var(--mut)}
ul.pl{margin:4px 0;padding:0 22px 0 0}
@media (max-width:900px){
 .layout{grid-template-columns:1fr}.dash{position:static;order:-1}
 .cols{grid-template-columns:1fr}
 body{font-size:17px}.card{padding:16px}
 .clsrow{grid-template-columns:1fr}
}
@media print{
 .noprint{display:none!important}
 body{background:#fff;font-size:13px}
 .card{box-shadow:none;border:1px solid #999;padding:10px}
 .wrap{padding:0}
 details.err{page-break-inside:avoid}
}
</style>
</head>

];

{ax:0,lv:"b",t:"mcq",r:"همزة الوصل في الأسماء العشرة",q:"أيُّ الكلمات الآتية تبدأ بهمزة وصل؟",o:["أَخَذَ","اسْمٌ","إِكْرَامٌ","أَمَلٌ"],a:1,

{ax:0,lv:"b",t:"mcq",r:"همزة الوصل في أمر الفعل الثلاثي",q:"ما نوع الهمزة في فعل الأمر [[اكْتُبْ]] من قولنا: «اكْتُبْ درسك»؟ وما سبب ذلك؟",o:["همزة قطع؛ لأنه فعل أمر","همزة قطع؛ لأنها تثبت نطقًا في الدرج","همزة وصل؛ لأنه أمر من فعل ثلاثي","همزة وصل؛ لأنه ماضٍ خماسي"],a:2,

{ax:0,lv:"b",t:"tf",r:"الفرق النطقي بين همزة القطع وهمزة الوصل",q:"تثبت همزة القطع نطقًا في الابتداء وفي درج الكلام، أما همزة الوصل فتُنطق في الابتداء وتسقط في الدرج.",truth:true,
 co:["همزة القطع تسقط في درج الكلام، وهمزة الوصل تثبت فيه","كلتا الهمزتين تسقطان نطقًا في درج الكلام","كلتا الهمزتين تثبتان نطقًا في الابتداء والدرج","همزة الوصل تُنطق في الدرج ولا تُنطق في الابتداء"],ca:-1,

{ax:0,lv:"m",t:"tf",r:"همزة القطع في مصدر الفعل الرباعي",q:"تبدأ كلمة [[إِكْرَام]] بهمزة وصل لأنها مصدر.",truth:false,

 why:"مصدر الفعل الرباعي على وزن «إفعال» وهمزته همزة قطع: إكرام، إرسال، إخراج. أما مصدر الفعل الخماسي والسداسي ففيه همزة وصل: انطلاق، استخراج."},
{ax:0,lv:"m",t:"fill",r:"همزة الوصل في أمر الفعل الخماسي",q:"قال المعلم: [[▢سْتَمِعُوا]] إلى زميلكم.",blanks:["ا"],hint:"الكلمة فعل أمر.",

{ax:0,lv:"m",t:"cls",r:"التمييز بين همزة الوصل والقطع في الأسماء",q:"حدّد نوع الهمزة في أول كل كلمة من الكلمات الآتية:",cats:["همزة وصل","همزة قطع"],

{ax:0,lv:"a",t:"exp",r:"مصدر الرباعي ومصدر السداسي",q:"علّل كتابة همزة [[اسْتِقْبَال]] همزة وصل، وهمزة [[إِقْبَال]] همزة قطع.",

 crit:[{t:"«استقبال» مصدر فعل سداسي (استقبل)",k:["سداسي","ستة","6"]},{t:"«إقبال» مصدر فعل رباعي (أقبل)",k:["رباعي","اربعة","4"]}],

{ax:0,lv:"a",t:"mcq",r:"تطبيق مركب على الهمزة في أول الكلمة",q:"أيُّ الجمل الآتية خالية من الخطأ في كتابة همزات أول الكلمات؟",o:["إنتظرنا الأستاذ طويلًا","أستخرج الباحث النتائج","انتظرنا الأستاذ طويلًا","إستمع الطلبة إلى الشرح"],a:2,

function stripD(s){return String(s).replace(/[\u064B-\u0652\u0670\u0640]/g,"")}
function norm(s){return stripD(s).replace(/[\s.,،؛:!؟?"«»()\[\]]/g,"").replace(/ى/g,"ي")}
function normK(s){return stripD(s).replace(/[أإآٱ]/g,"ا").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/\s+/g," ")}
function matchCorr(q,txt){const acc=q.acc.map(norm);const toks=String(txt).split(/\s+/).map(norm).filter(Boolean);return toks.some(t=>acc.includes(t))}
function critHits(q,txt){const n=normK(txt);return q.crit.map(c=>c.k.some(k=>n.includes(normK(k))))}
function plain(s){return String(s).replace(/\[\[|\]\]/g,"")}
function recon(q,arr){const m=q.q.match(/\[\[(.+?)\]\]/);let i=0;return m[1].replace(/▢/g,()=>arr[i++]||"؟")}
function levelOf(p){return p>=90?["ممتاز","g"]:p>=75?["جيد جدًا","g"]:p>=60?["جيد","y"]:p>=50?["مقبول","y"]:["يحتاج إلى مراجعة","r"]}
function fmtGrade(c){return String(Number((c*0.4).toFixed(1)))}
/*CORE_END*/

function stats(){

 return {c,w,n:c+w,per};
}

function bodyHTML(q,ans){

  return `<div class="opts">`+q.o.map((o,i)=>{let c="opt";if(ans){if(i===q.a)c+=" ok";else if(i===R.s)c+=" bad"}else if(U.sel===i)c+=" sel";

 }
 if(q.t==="tf"){
  const ch=ans?R.c:U.tf,kk=ans?R.k:U.k;
  const cls=v=>{let c="opt";if(ans){if(q.truth===v)c+=" ok";else if(ch===v)c+=" bad"}else if(ch===v)c+=" sel";return c};
  let h=`<div class="tfrow"><button class="${cls(true)}" data-act="tf" data-v="1" ${ans?"disabled":""}>صحيحة</button><button class="${cls(false)}" data-act="tf" data-v="0" ${ans?"disabled":""}>خاطئة</button></div>`;
  if(ch===false){
   h+=`<div class="sub">اختر التصحيح الصحيح للعبارة:</div><div class="opts">`+q.co.map((o,i)=>{let c="opt";if(ans){if(q.ca===i&&!q.truth)c+=" ok";else if(kk===i)c+=" bad"}else if(kk===i)c+=" sel";
    return `<button class="${c}" data-act="tfk" data-i="${i}" ${ans?"disabled":""}><span class="bul">${LB[i]}</span><span>${fmt(o)}</span></button>`}).join("")+`</div>`;
  }
  return h;
 }
 if(q.t==="fill"){
  const f=ans?R.f:U.f;let bi=0;
  const text=esc(q.q).replace(/\[\[(.+?)\]\]/g,(m,inner)=>'<span class="tg">'+inner.replace(/▢/g,()=>{const i=bi++;let c="blank";
   if(ans)c+=f[i]===q.blanks[i]?" ok":" bad";else if(U.act===i)c+=" act";
   return `<span class="${c}" data-act="blank" data-i="${i}">${f[i]||"؟"}</span>`})+'</span>');

 }
 if(q.t==="corr"){
  const v=ans?R.x:U.txt;const c=ans?(ans.ok?"ok-b":"bad-b"):"";
  return `<div class="sub">اكتب الصواب:</div><input id="ci" class="txt ${c}" type="text" autocomplete="off" value="${esc(v)}" ${ans?"readonly":""} placeholder="اكتب الكلمة هنا">`+
   (ans?"":`<div class="keys">`+LET.map(l=>`<button class="key" data-act="key" data-l="${l}">${l}</button>`).join("")+`</div>`);
 }
 if(q.t==="cls"){

   return `<div class="clsrow"><span class="w tg">${esc(it[0])}</span><div><select class="${c}" data-act="clsel" data-i="${i}" ${ans?"disabled":""}><option value="">— اختر —</option>${q.cats.map((k,j)=>`<option value="${j}" ${v===j?"selected":""}>${k}</option>`).join("")}</select>${ans&&v!==it[1]?`<div class="fixnote">الصواب: ${q.cats[it[1]]}</div>`:""}</div></div>`}).join("");
 }
 if(q.t==="exp"){

 }

function correctText(q){
 if(q.t==="mcq")return plain(q.o[q.a]);
 if(q.t==="tf")return q.truth?"العبارة صحيحة.":"العبارة خاطئة، والتصحيح: "+plain(q.co[q.ca]);
 if(q.t==="fill")return recon(q,q.blanks);
 if(q.t==="corr")return q.acc[0];
 if(q.t==="cls")return q.items.map(it=>plain(it[0])+" ← "+q.cats[it[1]]).join("؛ ");
 if(q.t==="exp")return q.model;
}
function userText(q,a){
 const r=a.r;
 if(q.t==="mcq")return r.s==null?"—":plain(q.o[r.s]);
 if(q.t==="tf")return (r.c?"صحيحة":"خاطئة")+(r.c===false&&r.k!=null?" — "+plain(q.co[r.k]):"");
 if(q.t==="fill")return recon(q,r.f);
 if(q.t==="corr"||q.t==="exp")return r.x||"—";
 if(q.t==="cls")return q.items.map((it,i)=>plain(it[0])+" ← "+(r.c[i]==null?"—":q.cats[r.c[i]])).join("؛ ");
}
function fbHTML(q,a){

 }

function canCheck(){

 <h3 class="sec" id="errs">الأسئلة التي أخطأتَ فيها (${wrong.length})</h3>
 ${wrong.length?wrong.map(i=>{const q=Q[i],a=S.ans[i];return `<details class="err"><summary>السؤال ${i+1} · ${TYPES[q.t]} · ${esc(AXES[q.ax].n)}</summary><div class="in">
  <p><b>السؤال:</b> ${fmt(q.q)}</p>
  <p><b>إجابتك:</b> ${a.r?esc(userText(q,a)):"—"}</p>
  <p><b>الإجابة الصحيحة:</b> ${esc(correctText(q))}</p>
  <div class="rule"><b>التعليل:</b> ${esc(q.why)}</div></div></details>`}).join(""):`<p>لا أخطاء تستوجب المراجعة.</p>`}
 ${Q.some((q,i)=>S.ans[i]&&S.ans[i].self)?`<p class="tiny">ملاحظة: اعتُمدت بعض إجابات التعليل ذاتيًا من قِبل الطالب (السؤال ${Q.map((q,i)=>S.ans[i]&&S.ans[i].self?i+1:null).filter(Boolean).join("، ")}).</p>`:""}
 <div class="row noprint" style="margin-top:22px">
  <button class="btn" data-act="retry">إعادة المحاولة</button>
  <button class="btn sec" data-act="review">مراجعة الأخطاء</button>
  <button class="btn gold" data-act="print">طباعة التقرير</button>
 </div>
 </section></div>`;
}

/* ===================== التحكم ===================== */
function render(){
 const app=document.getElementById("app");
 if(S.screen==="intro")app.innerHTML=renderIntro();
 else if(S.screen==="result")app.innerHTML=renderResult();
 else{
  const q=Q[S.cur];
  const first=S.cur%10===0&&!S.ans[S.cur]&&!S.seen.includes(q.ax);
  app.innerHTML=first?axIntro():renderQuiz();
 }
}
function syncCheck(){const b=document.getElementById("chk");if(b)b.disabled=!canCheck()}
function evalQ(q){
 if(q.t==="mcq")return {ok:U.sel===q.a,r:{s:U.sel}};
 if(q.t==="tf"){const ok=q.truth?U.tf===true:(U.tf===false&&U.k===q.ca);return {ok,r:{c:U.tf,k:U.k}}}
 if(q.t==="fill")return {ok:q.blanks.every((b,i)=>U.f[i]===b),r:{f:U.f.slice()}};
 if(q.t==="corr")return {ok:matchCorr(q,U.txt),r:{x:U.txt.trim()}};
 if(q.t==="cls")return {ok:q.items.every((it,i)=>U.c[i]===it[1]),r:{c:U.c.slice()}};
 if(q.t==="exp"){const h=critHits(q,U.txt);return {ok:h.every(Boolean),r:{x:U.txt.trim(),h}}}
}
function goTop(){window.scrollTo({top:0,behavior:"smooth"})}
function toFeedback(){const e=document.getElementById("fbbox");if(e)e.scrollIntoView({behavior:"smooth",block:"center"})}

document.addEventListener("click",e=>{
 const b=e.target.closest("[data-act]");if(!b)return;
 const act=b.dataset.act,q=Q[S.cur];
 if(act==="start"){S=fresh();S.started=true;S.screen="quiz";resetU();save();render();goTop()}
 else if(act==="resume"){S.screen="quiz";resetU();render();goTop()}
 else if(act==="toresult"){S.screen="result";render();goTop()}
 else if(act==="beginax"){S.seen.push(q.ax);save();render();goTop()}
 else if(act==="opt"){U.sel=+b.dataset.i;render()}
 else if(act==="tf"){U.tf=b.dataset.v==="1";U.k=null;render()}
 else if(act==="tfk"){U.k=+b.dataset.i;render()}
 else if(act==="blank"){U.act=+b.dataset.i;render()}
 else if(act==="letter"){U.f[U.act]=b.dataset.l;const nx=U.f.findIndex(v=>!v);U.act=nx>=0?nx:U.act;render()}
 else if(act==="key"){
  const el=document.getElementById(q.t==="corr"?"ci":"ex");if(!el)return;
  const st=el.selectionStart,en=el.selectionEnd;el.value=el.value.slice(0,st)+b.dataset.l+el.value.slice(en);
  el.selectionStart=el.selectionEnd=st+1;el.focus();U.txt=el.value;syncCheck();
 }
 else if(act==="check"){if(!canCheck())return;S.ans[S.cur]=evalQ(q);save();render();toFeedback()}
 else if(act==="self"){S.ans[S.cur].ok=true;S.ans[S.cur].self=true;save();render();toFeedback()}
 else if(act==="next"){
  if(S.cur===Q.length-1){S.screen="result";S.done=true}else{S.cur++;resetU()}
  save();render();goTop();
 }
 else if(act==="retry"||act==="restartq"){
  if(act==="restartq"&&!confirm("سيُمسح تقدمك الحالي. هل تريد إعادة البدء؟"))return;
  S=fresh();S.started=true;S.screen="quiz";resetU();save();render();goTop();
 }
 else if(act==="review"){document.querySelectorAll("details.err").forEach(d=>d.open=true);const t=document.getElementById("errs");if(t)t.scrollIntoView({behavior:"smooth"})}
 else if(act==="print"){document.querySelectorAll("details.err").forEach(d=>d.open=true);window.print()}
});
document.addEventListener("input",e=>{
 if(e.target.id==="ci"||e.target.id==="ex"){U.txt=e.target.value;syncCheck()}
});
document.addEventListener("change",e=>{
 const t=e.target;if(t.dataset&&t.dataset.act==="clsel"){U.c[+t.dataset.i]=t.value===""?null:+t.value;syncCheck()}
});
document.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&e.target.id==="ci"){e.preventDefault();const b=document.getElementById("chk");if(b&&!b.disabled)b.click()}
});
window.addEventListener("beforeprint",()=>{document.querySelectorAll("details.err").forEach(d=>d.open=true)});

if(S.screen==="quiz"&&S.done){S.screen="result"}
if(S.screen==="quiz"&&!S.started){S.screen="intro"}
if(S.screen==="quiz"&&S.started&&!S.done){S.screen="intro"}
render();
</script>
</body>
</html>
